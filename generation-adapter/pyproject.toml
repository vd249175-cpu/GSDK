[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "graphvideo-generation-adapter"
version = "0.1.0"
description = "Electron-managed GraphVideo generation transport worker"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0,<1",
  "comfy-sdk>=0.1.8,<1",
]

[project.scripts]
graphvideo-generation-adapter = "generation_adapter.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
