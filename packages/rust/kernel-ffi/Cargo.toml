[package]
name = "graphframework-kernel-ffi"
version = "0.1.0"
edition = "2021"
description = "Stable C ABI for language-neutral GraphFramework rule-space hosts"
license = "Apache-2.0"

[lib]
name = "graphframework_kernel_ffi"
crate-type = ["cdylib", "rlib"]

[dependencies]
graphframework-kernel = { path = "../kernel" }
graphframework-analysis = { path = "../analysis" }
serde_json = "1"
