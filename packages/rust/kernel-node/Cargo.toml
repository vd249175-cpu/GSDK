[package]
name = "graphframework-kernel-node"
version = "0.1.0"
edition = "2021"
description = "Node-API binding: JS business entities on the Rust rule space"
license = "Apache-2.0"

[lib]
name = "graphframework_kernel_node"
crate-type = ["cdylib"]

[dependencies]
graphframework-kernel = { path = "../kernel" }
graphframework-analysis = { path = "../analysis" }
napi = "3"
napi-derive = "3"
serde_json = "1"
