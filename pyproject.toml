[project]
name = "graphvideo-engine"
version = "0.1.0"
description = "GraphVideo Causal Graph Runtime & Multi-modal Python Native Generation Engine"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "pillow>=10.0.0",
    "python-dotenv>=1.2.3",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["app/resources/skills/.agents/skills/graphvideo-generation-models/python"]
